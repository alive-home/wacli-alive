<!doctype html>
<!-- The disk image window's background, 660×400 pt. scripts/draw-disk-image.mjs
     draws it at 1× and 2× into background.tiff. Finder draws the icons and
     their labels on top, 128 pt: wacli at (170, 180), Applications at
     (490, 180), the points layout.py gives. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:660px;height:400px;overflow:hidden}
  body{background:radial-gradient(ellipse 520px 320px at 330px 170px,#ffffff,#efeff1);
    font-family:-apple-system,system-ui,sans-serif;position:relative}
  svg{position:absolute;inset:0}
  .line{position:absolute;left:0;right:0;top:318px;text-align:center;
    font-size:15px;font-weight:600;letter-spacing:.005em;color:#1b1b1e}
  .hint{position:absolute;left:0;right:0;top:342px;text-align:center;
    font-size:12px;color:rgba(27,27,30,.54)}
</style></head><body>
<svg width="660" height="400" viewBox="0 0 660 400">
  <g fill="rgb(0,192,96)">
    <circle cx="268" cy="180" r="2.5" opacity=".25"/>
    <circle cx="296" cy="180" r="3.5" opacity=".4"/>
    <circle cx="326" cy="180" r="4.5" opacity=".6"/>
    <circle cx="358" cy="180" r="5.5" opacity=".8"/>
  </g>
  <path d="M378 180 L398 180 M398 180 L389 171 M398 180 L389 189" fill="none"
    stroke="#1b1b1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="line">Drag wacli to Applications.</div>
<div class="hint">Then open it and scan the code with your phone.</div>
</body></html>
